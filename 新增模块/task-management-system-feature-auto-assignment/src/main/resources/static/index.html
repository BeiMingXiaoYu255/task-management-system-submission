<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="app-header">
    <div class="container header-inner">
        <div>
            <h1>任务管理系统</h1>
            <p class="subtitle">Spring Boot 3 + Spring MVC + MyBatis + MySQL · 前后端分离演示页</p>
        </div>
        <span class="stack-tag">REST API</span>
    </div>
</header>

<main class="container">
    <section class="toolbar">
        <button id="btn-create" class="btn btn-primary" type="button">+ 新建任务</button>
        <div class="filters">
            <input id="filter-keyword" type="search" placeholder="搜索标题或描述">
            <select id="filter-status">
                <option value="">全部状态</option>
                <option value="TODO">待办</option>
                <option value="IN_PROGRESS">进行中</option>
                <option value="DONE">已完成</option>
            </select>
            <select id="filter-priority">
                <option value="">全部优先级</option>
                <option value="LOW">低</option>
                <option value="MEDIUM">中</option>
                <option value="HIGH">高</option>
            </select>
            <button id="btn-search" class="btn" type="button">查询</button>
            <button id="btn-reset" class="btn btn-ghost" type="button">重置</button>
        </div>
    </section>

    <section class="table-wrap">
        <table>
            <thead>
            <tr>
                <th class="col-id">ID</th>
                <th>标题</th>
                <th>描述</th>
                <th class="col-status">状态</th>
                <th class="col-priority">优先级</th>
                <th class="col-time">截止时间</th>
                <th class="col-actions">操作</th>
            </tr>
            </thead>
            <tbody id="task-tbody"></tbody>
        </table>
        <p id="empty-tip" class="empty-tip" hidden>暂无任务，点击「新建任务」开始吧</p>
    </section>

    <footer class="pager">
        <span id="page-info"></span>
        <div class="pager-buttons">
            <button id="btn-prev" class="btn btn-ghost" type="button">上一页</button>
            <button id="btn-next" class="btn btn-ghost" type="button">下一页</button>
        </div>
    </footer>
</main>

<dialog id="task-dialog" class="dialog">
    <form id="task-form" method="dialog" novalidate>
        <h2 id="dialog-title">新建任务</h2>
        <input type="hidden" id="task-id">

        <label class="field">
            <span>标题 <em>*</em></span>
            <input id="task-title" type="text" maxlength="100" placeholder="例如：完成需求分析">
        </label>

        <label class="field">
            <span>描述</span>
            <textarea id="task-description" rows="3" maxlength="500" placeholder="补充说明（可选）"></textarea>
        </label>

        <div class="field-row">
            <label class="field">
                <span>状态</span>
                <select id="task-status">
                    <option value="TODO">待办</option>
                    <option value="IN_PROGRESS">进行中</option>
                    <option value="DONE">已完成</option>
                </select>
            </label>
            <label class="field">
                <span>优先级</span>
                <select id="task-priority">
                    <option value="LOW">低</option>
                    <option value="MEDIUM" selected>中</option>
                    <option value="HIGH">高</option>
                </select>
            </label>
        </div>

        <label class="field">
            <span>截止时间</span>
            <input id="task-due-date" type="datetime-local">
        </label>

        <p id="form-error" class="form-error" hidden></p>

        <div class="dialog-actions">
            <button type="button" id="btn-cancel" class="btn btn-ghost">取消</button>
            <button type="submit" class="btn btn-primary">保存</button>
        </div>
    </form>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="/js/app.js"></script>
</body>
</html>
