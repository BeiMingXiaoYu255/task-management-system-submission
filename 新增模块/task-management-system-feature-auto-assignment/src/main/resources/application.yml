server:
  port: 8080

spring:
  application:
    name: task-management-system

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist=true：第一次启动时自动创建 task_management 库
    url: jdbc:mysql://localhost:3306/task_management?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    # 优先读环境变量，未设置时用下面的本机默认值（本机 MySQL root 密码）
    # 换电脑 / 公开仓库时请用环境变量 DB_USERNAME、DB_PASSWORD 覆盖，不要提交真实密码
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:2550505}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # 每次启动执行建表 / 示例数据脚本（脚本本身是幂等的：CREATE TABLE IF NOT EXISTS / INSERT IGNORE）
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: cn.edu.cjlu.taskmanagement.entity
  configuration:
    map-underscore-to-camel-case: true
    # 开发阶段打印 SQL；生产环境可改为 warn
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 智能分配配置
# dispatch-mode 四选一：LOCAL_ONLY / LLM_ONLY / LOCAL_FIRST（默认）/ LLM_FIRST
# *_FIRST 模式：主路失败或无匹配时自动回退备用路
assignment:
  dispatch-mode: ${ASSIGNMENT_DISPATCH_MODE:LOCAL_FIRST}
  match-threshold: 50
  workload-penalty: 5

# LLM 备用链路（OpenAI 兼容协议，换厂商只改配置）
# 三项全配才启用；api-key 必须走环境变量，不要提交真实 Key
# DeepSeek: LLM_BASE_URL=https://api.deepseek.com          LLM_MODEL=deepseek-chat
# 智谱GLM:  LLM_BASE_URL=https://open.bigmodel.cn/api/paas/v4 LLM_MODEL=glm-4-flash LLM_CHAT_PATH=/chat/completions
llm:
  base-url: ${LLM_BASE_URL:}
  chat-path: ${LLM_CHAT_PATH:/v1/chat/completions}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:20}
  max-candidates: 20

logging:
  level:
    cn.edu.cjlu.taskmanagement.mapper: debug
